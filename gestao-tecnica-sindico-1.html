function carregarScript(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = src;
    script.onload = () => resolve();
    script.onerror = () => reject(new Error("Falha ao carregar " + src));
    document.head.appendChild(script);
  });
}

let firebasePromise = null;
function carregarFirebase() {
  if (window.firebase && window.firebase.apps && window.firebase.apps.length) {
    return Promise.resolve({ auth: window.firebase.auth(), db: window.firebase.firestore() });
  }
  if (firebasePromise) return firebasePromise;
  const base = "https://cdnjs.cloudflare.com/ajax/libs/firebase/10.13.2/";
  firebasePromise = (async () => {
    if (!window.firebase) {
      await carregarScript(base + "firebase-app-compat.min.js");
    }
    await Promise.all([
      carregarScript(base + "firebase-auth-compat.min.js"),
      carregarScript(base + "firebase-firestore-compat.min.js"),
    ]);
    if (!window.firebase.apps.length) {
      window.firebase.initializeApp(FIREBASE_CONFIG);
    }
    return { auth: window.firebase.auth(), db: window.firebase.firestore() };
  })().catch((e) => {
    firebasePromise = null;
    throw e;
  });
  return firebasePromise;
}

function configurarStorage(db, userId) {
  const base = () => db.collection("usuarios").doc(userId).collection("dados");
  window.storage = {
    async get(key) {
      const snap = await base().doc(key).get();
      if (!snap.exists) throw new Error("chave não encontrada: " + key);
      return { key, value: snap.data().value, shared: false };
    },
    async set(key, value) {
      await base().doc(key).set({ value });
      return { key, value, shared: false };
    },
    async delete(key) {
      await base().doc(key).delete();
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const snap = await base().get();
      const keys = snap.docs.map((d) => d.id).filter((k) => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: false };
    },
  };
}

const PARADAS_PT = new Set(["de", "da", "do", "das", "dos", "em", "no", "na", "nos", "nas", "que", "não", "se", "ao", "aos", "a", "o", "e", "ou", "com", "sem", "para", "por", "um", "uma", "uns", "umas", "é", "meu", "minha"]);

function normalizarTexto(t) {
  return (t || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function palavrasChave(t) {
  return normalizarTexto(t)
    .split(/[^a-z0-9çãõáéíóúâêô]+/i)
    .filter((p) => p.length > 2 && !PARADAS_PT.has(p));
}

function buscarArtigoRegimento(pergunta) {
  const termos = palavrasChave(pergunta);
  if (termos.length === 0) return null;
  let melhor = null;
  let melhorPontuacao = 0;
  for (const infra of INFRACOES) {
    const palavrasInfra = new Set([...palavrasChave(infra.titulo), ...palavrasChave(infra.penalidade)]);
    let pontuacao = 0;
    for (const termo of termos) {
      if (palavrasInfra.has(termo)) pontuacao += 1;
      else {
        for (const p of palavrasInfra) {
          if (p.startsWith(termo) || termo.startsWith(p)) {
            pontuacao += 0.5;
            break;
          }
        }
      }
    }
    if (pontuacao > melhorPontuacao) {
      melhorPontuacao = pontuacao;
      melhor = infra;
    }
  }
  return melhorPontuacao > 0 ? melhor : null;
}

function responderGenio(pergunta) {
  const achado = buscarArtigoRegimento(pergunta);
  if (achado) {
    return `Sobre isso, o Regimento Interno prevê:\n\n"${achado.titulo}"\n\nPenalidade: ${achado.penalidade}\n\nBase legal: ${achado.baseLegal}`;
  }
  return "Não encontrei um artigo cadastrado sobre esse assunto específico. Consulte diretamente o Regimento Interno do condomínio, ou cadastre esse item nas infrações da aba Notificações para que eu passe a reconhecê-lo.";
}

/* ---------------------------------------------------------
   jsPDF (carregado em tempo de execução via cdnjs — mesma
   origem já usada por React/ReactDOM/Babel, comprovadamente
   confiável nos artefatos do Claude e fora deles)
--------------------------------------------------------- */
let jsPdfCarregando = null;
function carregarJsPDF() {
  if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  if (jsPdfCarregando) return jsPdfCarregando;
  jsPdfCarregando = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    script.onload = () => {
      if (window.jspdf && window.jspdf.jsPDF) resolve(window.jspdf.jsPDF);
      else reject(new Error("jsPDF carregou mas não expôs window.jspdf.jsPDF"));
    };
    script.onerror = () => reject(new Error("Falha ao carregar jsPDF do CDN"));
    document.head.appendChild(script);
  });
  return jsPdfCarregando;
}

function quebrarLinhas(doc, texto, larguraMax) {
  return doc.splitTextToSize(texto, larguraMax);
}

function formatDate(d) {
  if (!d) return "—";
  const dt = new Date(d + "T00:00:00");
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function todayISO() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

function diaDoAno(date) {
  const inicio = new Date(date.getFullYear(), 0, 0);
  const diff = date - inicio;
  return Math.floor(diff / 86400000);
}

function daysUntil(dateStr) {
  const target = new Date(dateStr + "T00:00:00");
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  return Math.round((target - now) / 86400000);
}

function normaStatus(norma) {
  const d = daysUntil(norma.proximaVerificacao);
  if (d < 0) return { key: "vencido", label: `Vencida há ${Math.abs(d)}d`, color: "var(--danger)" };
  if (d <= 30) return { key: "alerta", label: `Vence em ${d}d`, color: "var(--warning)" };
  return { key: "ok", label: `Em dia (${d}d)`, color: "var(--success)" };
}

function obrigacaoStatus(item) {
  if (!item.dataVencimento) return { key: "pendente", label: "Sem data cadastrada", color: "var(--text-muted)" };
  const d = daysUntil(item.dataVencimento);
  if (d < 0) return { key: "vencido", label: `Vencido há ${Math.abs(d)} dia${Math.abs(d) === 1 ? "" : "s"}`, color: "var(--danger)" };
  if (d <= 30) return { key: "alerta", label: `Faltam ${d} dia${d === 1 ? "" : "s"} para vencer`, color: "var(--warning)" };
  return { key: "ok", label: `Faltam ${d} dias para vencer`, color: "var(--success)" };
}

function formatMesAno(mesAno) {
  if (!mesAno) return "";
  const [ano, mes] = mesAno.split("-");
  const idx = parseInt(mes, 10) - 1;
  return `${MESES_PT[idx] || mes}/${ano}`;
}

function formatMoeda(v) {
  const n = Number(v) || 0;
  return "R$ " + n.toLocaleString("pt-BR", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function formatVariacao(v) {
  if (v === null || v === undefined || !isFinite(v)) return null;
  const sinal = v >= 0 ? "+" : "";
  return sinal + v.toFixed(1).replace(".", ",") + "%";
}

function corVariacao(v) {
  if (v === null || v === undefined || !isFinite(v)) return "var(--text-muted)";
  if (v > 0) return "var(--warning)";
  if (v < 0) return "var(--success)";
  return "var(--text-muted)";
}

function calcularVariacaoValor(consumos, entryAtual) {
  const anteriores = consumos
    .filter((c) => c.id !== entryAtual.id && c.tipo === entryAtual.tipo && (entryAtual.tipo !== "energia" || c.bloco === entryAtual.bloco) && c.mesAno < entryAtual.mesAno)
    .sort((a, b) => (a.mesAno < b.mesAno ? 1 : -1));
  const anterior = anteriores[0];
  if (!anterior || !anterior.valor) return null;
  return ((entryAtual.valor - anterior.valor) / anterior.valor) * 100;
}

async function persist(key, value) {
  try {
    await window.storage.set(key, JSON.stringify(value), false);
  } catch (e) {
    console.error("Falha ao salvar", key, e);
  }
}

async function load(key, fallback) {
  try {
    const res = await window.storage.get(key, false);
    if (res && res.value) return JSON.parse(res.value);
    return fallback;
  } catch (e) {
    return fallback;
  }
}

  function atualizarItem(i, campo, valor) {
    setItens((prev) => prev.map((it, idx) => (idx === i ? { ...it, [campo]: valor } : it)));
  }
  function adicionarLinha() {
    setItens((prev) => [...prev, { item: "", valor: "" }]);
  }
  function removerLinha(i) {
    setItens((prev) => prev.filter((_, idx) => idx !== i));
  }

  const total = itens.reduce((soma, it) => soma + (Number(it.valor) || 0), 0);

  return (
    <Modal title="Orçamento da demanda" onClose={onClose}>

          <div key={i} className="flex items-center gap-2">

  const prioridade = PRIORIDADES.find((p) => p.key === demanda.prioridade) || PRIORIDADES[0];
  const faseIdx = FASES.findIndex((f) => f.key === demanda.fase);
  const atrasada = demanda.prazo && !demanda.cancelada && demanda.fase !== "concluida" && daysUntil(demanda.prazo) < 0;
  const totalOrcamento = (demanda.orcamentoItens || []).reduce((soma, it) => soma + (Number(it.valor) || 0), 0);

  return (
    <div className="bg-[var(--bg-card)] border border-[var(--border)] rounded-2xl p-4 shadow-lg shadow-black/20">
      <div className="flex items-start justify-between gap-3 mb-3">
        <div>
          <div className="flex items-center gap-2 flex-wrap mb-1">
            <Pill color={prioridade.color}>{demanda.prioridade}</Pill>
            <span className="text-[11px] text-[var(--text-muted)] uppercase tracking-wider">{demanda.categoria}</span>
            {atrasada && <Pill color="var(--danger)">Prazo vencido</Pill>}
            {demanda.cancelada && <Pill color="var(--text-muted)">Cancelada</Pill>}
          </div>
          <h4 className="text-sm font-semibold text-[var(--text-primary)]">{demanda.titulo}</h4>
          {demanda.local && (
            <div className="flex items-center gap-1 text-xs text-[var(--text-secondary)] mt-1">
              <MapPin size={12} /> {demanda.local}
            </div>
          )}
        </div>
        <button onClick={() => onDelete(demanda.id)} className="text-[var(--text-muted)] hover:text-[var(--danger)] p-1 shrink-0">
          <Trash2 size={14} />
        </button>
      </div>

      {demanda.descricao && <p className="text-xs text-[var(--text-secondary)] mb-3">{demanda.descricao}</p>}

      {!demanda.cancelada && (
        <div className="flex items-center gap-0.5 mb-3 overflow-x-auto pb-1">
          {FASES.map((f, i) => (
            <React.Fragment key={f.key}>
              <button
                onClick={() => onSetFase(demanda.id, f.key)}
                className="text-[10px] font-medium px-2 py-1 rounded whitespace-nowrap transition-colors"
                style={{
                  backgroundColor: i <= faseIdx ? "var(--accent)" : "var(--bg-card-alt)",
                  color: i <= faseIdx ? "var(--accent-contrast)" : "var(--text-muted)",
                }}
              >
                {f.label}
              </button>
              {i < FASES.length - 1 && <ChevronRight size={12} className="text-[var(--text-faint)] shrink-0" />}
            </React.Fragment>
          ))}
        </div>
      )}

      <div className="flex items-center justify-between text-xs text-[var(--text-secondary)]">
        <div className="flex items-center gap-3 flex-wrap">
          {demanda.responsavel && (
            <span className="flex items-center gap-1"><User size={12} /> {demanda.responsavel}</span>
          )}
          {demanda.prazo && (
            <span className="flex items-center gap-1"><Calendar size={12} /> {formatDate(demanda.prazo)}</span>
          )}
        </div>
        <div className="flex items-center gap-3">
          {!demanda.cancelada && demanda.fase !== "concluida" && (
            <button onClick={() => onCancelar(demanda.id)} className="text-[var(--text-muted)] hover:text-[var(--danger)]">
              Cancelar
            </button>
          )}
          <button onClick={() => setShowOrcamento(true)} className="text-[var(--accent)] hover:text-[var(--accent-hover)]">
            Orçamento{totalOrcamento > 0 ? ` (${formatMoeda(totalOrcamento)})` : ""}
          </button>
          <button onClick={() => setShowHist((s) => !s)} className="text-[var(--accent)] hover:text-[var(--accent-hover)]">
            Histórico ({demanda.historico?.length || 0})
          </button>
        </div>
      </div>

      {showOrcamento && (
        <OrcamentoDemandaModal
          itensIniciais={demanda.orcamentoItens || []}
          onClose={() => setShowOrcamento(false)}
          onSave={(itens) => {
            onSaveOrcamento(demanda.id, itens);
            setShowOrcamento(false);
          }}
        />
      )}

      {showHist && (
        <div className="mt-3 pt-3 border-t border-[var(--border-soft)]">
          <div className="space-y-2 mb-3 max-h-40 overflow-y-auto">
            {[...(demanda.historico || [])].reverse().map((h, i) => (
              <div key={i} className="text-xs">
                <span className="text-[var(--text-muted)]" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{formatDate(h.data)}</span>
                <span className="text-[var(--text-body)] ml-2">{h.texto}</span>
              </div>
            ))}
          </div>
          <div className="flex gap-2">
            <input
              value={novaNota}
              onChange={(e) => setNovaNota(e.target.value)}
              placeholder="Adicionar atualização..."
              className={inputCls + " flex-1"}
            />
            <button
              onClick={() => {
                if (!novaNota.trim()) return;
                onAddHistorico(demanda.id, novaNota.trim());
                setNovaNota("");
              }}
              className="bg-[var(--accent)] text-[var(--accent-contrast)] text-xs font-semibold px-3 rounded-lg"
            >
              OK
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function ObrigacaoCard({ item, onSave, onDelete }) {
  const [expanded, setExpanded] = useState(false);
  const [realizacao, setRealizacao] = useState(item.dataRealizacao || "");
  const [vencimento, setVencimento] = useState(item.dataVencimento || "");
  const [orcamento, setOrcamento] = useState(item.orcamento || "");
  const [empresaTelefone, setEmpresaTelefone] = useState(item.empresaTelefone || "");
  const status = obrigacaoStatus(item);
  const temDatas = !!(item.dataRealizacao && item.dataVencimento);

  useEffect(() => {
    setRealizacao(item.dataRealizacao || "");
    setVencimento(item.dataVencimento || "");
    setOrcamento(item.orcamento || "");
    setEmpresaTelefone(item.empresaTelefone || "");
  }, [item.dataRealizacao, item.dataVencimento, item.orcamento, item.empresaTelefone]);

  return (
    <div className="relative bg-[var(--bg-card)] border border-[var(--border)] rounded-2xl overflow-hidden shadow-lg shadow-black/20">
      <div className="absolute left-0 top-0 bottom-0 w-1.5" style={{ backgroundColor: status.color }} />
      <button
        onClick={() => setExpanded((s) => !s)}
        className="w-full text-left pl-5 pr-4 py-4 flex items-center justify-between gap-3"
      >
        <div>
          <p className="text-sm text-[var(--text-primary)] font-medium">{item.nome}</p>
          {temDatas ? (
            <p className="text-[11px] text-[var(--text-muted)] mt-1" style={{ fontFamily: "'JetBrains Mono', monospace" }}>
              Realizado {formatDate(item.dataRealizacao)} · Vence {formatDate(item.dataVencimento)}
            </p>
          ) : (
            <p className="text-[11px] text-[var(--text-muted)] mt-1">Toque para cadastrar</p>
          )}
          {item.empresaTelefone && <p className="text-[11px] text-[var(--text-secondary)] mt-0.5">{item.empresaTelefone}</p>}
        </div>
        <div className="flex items-center gap-2 shrink-0">
          <Pill color={status.color}>{status.label}</Pill>
          {expanded ? <ChevronLeft size={16} className="text-[var(--text-muted)] rotate-90" /> : <ChevronRight size={16} className="text-[var(--text-muted)]" />}
        </div>
      </button>

      {expanded && (
        <div className="px-5 pb-4 pt-1 border-t border-[var(--border-soft)]">
          <Field label="Data de realização do serviço">
            <input type="date" className={inputCls} value={realizacao} onChange={(e) => setRealizacao(e.target.value)} />
          </Field>
          {realizacao && (
            <Field label="Data de vencimento da validade">
              <input type="date" className={inputCls} value={vencimento} onChange={(e) => setVencimento(e.target.value)} />
            </Field>
          )}
          <div className="grid grid-cols-2 gap-3">
            <Field label="Orçamento">
              <input className={inputCls} value={orcamento} onChange={(e) => setOrcamento(e.target.value)} placeholder="R$" />
            </Field>
            <Field label="Empresa e telefone">
              <input className={inputCls} value={empresaTelefone} onChange={(e) => setEmpresaTelefone(e.target.value)} placeholder="Nome — (00) 00000-0000" />
            </Field>
          </div>
          <div className="flex items-center gap-2 mt-1">
            <button
              disabled={!realizacao || !vencimento}
              onClick={() => {
                onSave(item.id, { dataRealizacao: realizacao, dataVencimento: vencimento, orcamento, empresaTelefone });
                setExpanded(false);
              }}
              className="flex-1 bg-[var(--accent)] disabled:opacity-40 text-[var(--accent-contrast)] font-semibold py-2 rounded-lg text-sm"
            >
              Salvar
            </button>
            <button onClick={() => onDelete(item.id)} className="text-[var(--text-muted)] hover:text-[var(--danger)] p-2">
              <Trash2 size={16} />
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function LoginScreen({ onLogin, onLoginGoogle, onCriarConta, tema, onAlternarTema, erroInicial }) {

function CriarContaScreen({ onCriar, onVoltar, tema }) {
  const [nomeCompleto, setNomeCompleto] = useState("");
  const [nomeCondominio, setNomeCondominio] = useState("");
  const [cnpj, setCnpj] = useState("");
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [erro, setErro] = useState("");
  const [carregando, setCarregando] = useState(false);

  async function criar() {
    if (!nomeCompleto.trim() || !nomeCondominio.trim() || !email.trim() || senha.length < 6) {
      setErro("Preencha nome, condomínio e e-mail, e uma senha com pelo menos 6 caracteres.");
      return;
    }
    setErro("");
    setCarregando(true);
    try {
      await onCriar({
        nomeCompleto: nomeCompleto.trim(),
        nomeCondominio: nomeCondominio.trim(),
        cnpj: cnpj.trim(),
        email: email.trim(),
        senha,
      });
    } catch (e) {
      setErro(traduzErroFirebase(e));
      setCarregando(false);
    }
  }

  return (
    <div data-theme={tema} className="min-h-screen bg-[var(--bg)] flex items-center justify-center px-4 py-10" style={{ fontFamily: "'Inter', sans-serif" }}>
      <FontStyle />
      <div className="w-full max-w-sm">
        <div className="text-center mb-6">

/* ---------------------------------------------------------
   App principal
--------------------------------------------------------- */

function App() {
  const [screen, setScreen] = useState("loading"); // loading | login | novoCondominio | selecionar | app
  const [dataLoading, setDataLoading] = useState(false);
  const [tab, setTab] = useState("dashboard");
  const [demandas, setDemandas] = useState([]);
  const [normas, setNormas] = useState([]);
  const [obrigacoesPeriodicas, setObrigacoesPeriodicas] = useState([]);
  const [obrigacoesTrabalhistas, setObrigacoesTrabalhistas] = useState([]);
  const [manutencoes, setManutencoes] = useState([]);
  const [comunicados, setComunicados] = useState([]);
  const [consumos, setConsumos] = useState([]);
  const [consumoView, setConsumoView] = useState("agua");
  const [zeladoriaView, setZeladoriaView] = useState("demanda");
  const [obrigacaoView, setObrigacaoView] = useState("periodicas");
  const [limpezaView, setLimpezaView] = useState("escalas");
  const [limpezaEscalas, setLimpezaEscalas] = useState([]);
  const [limpezaEstoque, setLimpezaEstoque] = useState([]);
  const [limpezaFinanceiro, setLimpezaFinanceiro] = useState([]);
  const [notificacoes, setNotificacoes] = useState([]);

  const [authEmail, setAuthEmail] = useState("");
  const [authNome, setAuthNome] = useState("");
  const [condominios, setCondominios] = useState([]);
  const [condominioAtual, setCondominioAtual] = useState(null);
  const [contaMenuOpen, setContaMenuOpen] = useState(false);
  const [genioAberto, setGenioAberto] = useState(false);
  const [genioMensagens, setGenioMensagens] = useState([
    { autor: "genio", texto: "Oi! Sou o Gênio do Regimento. Me pergunte sobre qualquer assunto — ex.: \"crachá\", \"velocidade\", \"mudança\" — que eu busco o artigo exato cadastrado." },
  ]);
  const [genioInput, setGenioInput] = useState("");
  const [tema, setTema] = useState("escuro"); // "escuro" | "claro" — preferência pessoal, não fica presa a um condomínio

  const [modal, setModal] = useState(null); // 'demanda' | 'norma' | 'obrigacaoPeriodicaNova' | 'obrigacaoTrabalhistaNova' | 'manutencao' | 'comunicado' | 'consumo'
  const [editing, setEditing] = useState(null);

  async function carregarDadosDoCondominio(id) {
    setDataLoading(true);
    const [d, n, op, ot, m, c, cons, notifs, le, ee, lf] = await Promise.all([
      load(`demandas:${id}`, []),
      load(`normas:${id}`, null),
      load(`obrigacoesPeriodicas:${id}`, null),
      load(`obrigacoesTrabalhistas:${id}`, null),
      load(`manutencoes:${id}`, []),
      load(`comunicados:${id}`, []),
      load(`consumos:${id}`, []),
      load(`notificacoes:${id}`, []),
      load(`limpezaEscalas:${id}`, null),
      load(`limpezaEstoque:${id}`, null),
      load(`limpezaFinanceiro:${id}`, []),
    ]);
    setDemandas(d);
    if (n === null) {
      const seeded = seedNormas();
      setNormas(seeded);
      persist(`normas:${id}`, seeded);
    } else {
      setNormas(n);
    }
    if (op === null) {
      const seeded = seedObrigacoesPeriodicas();
      setObrigacoesPeriodicas(seeded);
      persist(`obrigacoesPeriodicas:${id}`, seeded);
    } else {
      setObrigacoesPeriodicas(op);
    }
    if (ot === null) {
      const seeded = seedObrigacoesTrabalhistas();
      setObrigacoesTrabalhistas(seeded);
      persist(`obrigacoesTrabalhistas:${id}`, seeded);
    } else {
      setObrigacoesTrabalhistas(ot);
    }
    if (le === null) {
      const seeded = seedLimpezaEscalas();
      setLimpezaEscalas(seeded);
      persist(`limpezaEscalas:${id}`, seeded);
    } else {
      setLimpezaEscalas(le);
    }
    if (ee === null) {
      const seeded = seedLimpezaEstoque();
      setLimpezaEstoque(seeded);
      persist(`limpezaEstoque:${id}`, seeded);
    } else {
      setLimpezaEstoque(ee);
    }
    setLimpezaFinanceiro(lf);
    setManutencoes(m);
    setComunicados(c);
    setConsumos(cons);
    setNotificacoes(notifs);
    setDataLoading(false);
  }

  async function selecionarCondominio(cond) {
    setCondominioAtual(cond);
    setContaMenuOpen(false);
    await carregarDadosDoCondominio(cond.id);
    setScreen("app");
  }

  function decidirProximaTela(listaCondominios) {
    if (listaCondominios.length === 0) setScreen("novoCondominio");
    else if (listaCondominios.length === 1) selecionarCondominio(listaCondominios[0]);
    else setScreen("selecionar");
  }

  const fluxoManualRef = useRef(false);
  const [erroLoginInicial, setErroLoginInicial] = useState("");

  useEffect(() => {
    let unsubscribe = () => {};
    (async () => {
      try {
        const { auth, db } = await carregarFirebase();
        try {
          await auth.getRedirectResult();
        } catch (e) {
          setErroLoginInicial(traduzErroFirebase(e));
        }
        unsubscribe = auth.onAuthStateChanged(async (user) => {
          if (fluxoManualRef.current) return;
          if (!user) {
            setScreen("login");
            return;
          }
          configurarStorage(db, user.uid);
          setAuthEmail(user.email || "");
          setAuthNome(user.displayName || "");
          const [conds, temaSalvo] = await Promise.all([load("condominios", []), load("tema", null)]);
          if (temaSalvo === "claro" || temaSalvo === "escuro") setTema(temaSalvo);
          setCondominios(conds);
          decidirProximaTela(conds);
        });
      } catch (e) {
        setScreen("login");
      }
    })();
    return () => unsubscribe();
  }, []);

  function alternarTema() {
    const novo = tema === "escuro" ? "claro" : "escuro";
    setTema(novo);
    if (window.storage) persist("tema", novo);
  }

  function enviarMensagemGenio() {
    const pergunta = genioInput.trim();
    if (!pergunta) return;
    const resposta = responderGenio(pergunta);
    setGenioMensagens((prev) => [...prev, { autor: "usuario", texto: pergunta }, { autor: "genio", texto: resposta }]);
    setGenioInput("");
  }

  async function handleLogin(email, senha) {
    const { auth } = await carregarFirebase();
    await auth.signInWithEmailAndPassword(email, senha);
    // onAuthStateChanged cuida do resto (configura o storage e decide a tela)
  }

  async function handleLoginGoogle() {
    const { auth } = await carregarFirebase();
    const provider = new window.firebase.auth.GoogleAuthProvider();
    // Redireciona em vez de abrir popup — é o método confiável em navegadores de celular,
    // onde popups costumam ser bloqueados silenciosamente. A página recarrega ao voltar do
    // Google, e getRedirectResult() (acima) conclui o login e mostra erro, se houver.
    await auth.signInWithRedirect(provider);
  }

  async function criarConta({ nomeCompleto, nomeCondominio, cnpj, email, senha }) {
    fluxoManualRef.current = true;
    try {
      const { auth, db } = await carregarFirebase();
      const cred = await auth.createUserWithEmailAndPassword(email, senha);
      await cred.user.updateProfile({ displayName: nomeCompleto });
      configurarStorage(db, cred.user.uid);
      setAuthEmail(cred.user.email || email);
      setAuthNome(nomeCompleto);
      const novo = { id: uid(), nome: nomeCondominio, cnpj };
      await persist("condominios", [novo]);
      setCondominios([novo]);
      await carregarDadosDoCondominio(novo.id);
      setCondominioAtual(novo);
      setScreen("app");
    } finally {
      fluxoManualRef.current = false;
    }
  }

  async function criarCondominio(nome) {
    const novo = { id: uid(), nome };
    const next = [...condominios, novo];
    setCondominios(next);
    await persist("condominios", next);
    selecionarCondominio(novo);
  }

  async function handleLogout() {
    try {
      const { auth } = await carregarFirebase();
      await auth.signOut();
    } catch (e) {
      /* sem sessão para limpar */
    }
    window.storage = undefined;
    setAuthEmail("");
    setAuthNome("");
    setCondominioAtual(null);
    setContaMenuOpen(false);
    setCondominios([]);
    setDemandas([]);
    setNormas([]);
    setObrigacoesPeriodicas([]);
    setObrigacoesTrabalhistas([]);
    setManutencoes([]);
    setComunicados([]);
    setConsumos([]);
    setNotificacoes([]);
    setLimpezaEscalas([]);
    setLimpezaEstoque([]);
    setLimpezaFinanceiro([]);
    setScreen("login");
  }

  /* ---------- Demandas ---------- */
  function saveDemandas(next) {
    setDemandas(next);
    persist(`demandas:${condominioAtual.id}`, next);
  }
  function addDemanda(data) {
    const nova = {
      id: uid(),
      ...data,
      fase: "aberta",
      cancelada: false,
      dataAbertura: todayISO(),
      historico: [{ data: todayISO(), texto: "Demanda registrada" }],
    };
    saveDemandas([nova, ...demandas]);
  }
  function setFase(id, faseKey) {
    saveDemandas(
      demandas.map((d) => {
        if (d.id !== id) return d;
        if (d.fase === faseKey) {
          // clicou de novo na fase já ativa: volta para a fase anterior (desfaz o clique)
          const voltarPara = d.faseAnterior || "aberta";
          return {
            ...d,
            fase: voltarPara,
            faseAnterior: d.fase,
            historico: [...(d.historico || []), { data: todayISO(), texto: `Fase revertida para "${FASES.find((f) => f.key === voltarPara)?.label}"` }],
          };
        }
        return {
          ...d,
          fase: faseKey,
          faseAnterior: d.fase,
          historico: [...(d.historico || []), { data: todayISO(), texto: `Fase alterada para "${FASES.find((f) => f.key === faseKey)?.label}"` }],
        };
      })
    );
  }
  function cancelarDemanda(id) {
    saveDemandas(
      demandas.map((d) =>
        d.id === id ? { ...d, cancelada: true, historico: [...(d.historico || []), { data: todayISO(), texto: "Demanda cancelada" }] } : d
      )
    );
  }
  function addHistorico(id, texto) {
    saveDemandas(demandas.map((d) => (d.id === id ? { ...d, historico: [...(d.historico || []), { data: todayISO(), texto }] } : d)));
  }
  function updateOrcamentoDemanda(id, orcamentoItens) {
    saveDemandas(demandas.map((d) => (d.id === id ? { ...d, orcamentoItens } : d)));
  }
  function deleteDemanda(id) {
    saveDemandas(demandas.filter((d) => d.id !== id));
  }

  /* ---------- Normas ---------- */
  function saveNormas(next) {
    setNormas(next);
    persist(`normas:${condominioAtual.id}`, next);
  }
  function addNorma(data) {
    saveNormas([{ id: uid(), ...data }, ...normas]);
  }
  function updateNorma(id, data) {
    saveNormas(normas.map((n) => (n.id === id ? { ...n, ...data } : n)));
  }
  function deleteNorma(id) {
    saveNormas(normas.filter((n) => n.id !== id));
  }
  function verificarNorma(norma) {
    const hoje = todayISO();
    const prox = new Date();
    prox.setMonth(prox.getMonth() + (norma.periodicidadeMeses || 12));
    updateNorma(norma.id, { ultimaVerificacao: hoje, proximaVerificacao: prox.toISOString().slice(0, 10) });
  }

  /* ---------- Obrigações periódicas ---------- */
  function saveObrigacoesPeriodicas(next) {
    setObrigacoesPeriodicas(next);
    persist(`obrigacoesPeriodicas:${condominioAtual.id}`, next);
  }
  function updateObrigacaoPeriodica(id, data) {
    saveObrigacoesPeriodicas(obrigacoesPeriodicas.map((p) => (p.id === id ? { ...p, ...data } : p)));
  }
  function addObrigacaoPeriodica(nome) {
    saveObrigacoesPeriodicas([...obrigacoesPeriodicas, { id: uid(), nome, fixo: false, dataRealizacao: null, dataVencimento: null, orcamento: "", empresaTelefone: "" }]);
  }
  function deleteObrigacaoPeriodica(id) {
    saveObrigacoesPeriodicas(obrigacoesPeriodicas.filter((p) => p.id !== id));
  }

  /* ---------- Obrigações trabalhistas ---------- */
  function saveObrigacoesTrabalhistas(next) {
    setObrigacoesTrabalhistas(next);
    persist(`obrigacoesTrabalhistas:${condominioAtual.id}`, next);
  }
  function updateObrigacaoTrabalhista(id, data) {
    saveObrigacoesTrabalhistas(obrigacoesTrabalhistas.map((p) => (p.id === id ? { ...p, ...data } : p)));
  }
  function addObrigacaoTrabalhista(nome) {
    saveObrigacoesTrabalhistas([...obrigacoesTrabalhistas, { id: uid(), nome, fixo: false, dataRealizacao: null, dataVencimento: null, orcamento: "", empresaTelefone: "" }]);
  }
  function deleteObrigacaoTrabalhista(id) {
    saveObrigacoesTrabalhistas(obrigacoesTrabalhistas.filter((p) => p.id !== id));
  }

  /* ---------- Manutenções ---------- */
  function saveManutencoes(next) {
    setManutencoes(next);
    persist(`manutencoes:${condominioAtual.id}`, next);
  }
  function addManutencao(data) {
    saveManutencoes([{ id: uid(), ...data }, ...manutencoes]);
  }
  function deleteManutencao(id) {
    saveManutencoes(manutencoes.filter((m) => m.id !== id));
  }

  /* ---------- Comunicados ---------- */
  function saveComunicados(next) {
    setComunicados(next);
    persist(`comunicados:${condominioAtual.id}`, next);
  }
  function addComunicado(data) {
    saveComunicados([{ id: uid(), data: todayISO(), ...data }, ...comunicados]);
  }
  function deleteComunicado(id) {
    saveComunicados(comunicados.filter((c) => c.id !== id));
  }

  /* ---------- Consumos ---------- */
  function saveConsumos(next) {
    setConsumos(next);
    persist(`consumos:${condominioAtual.id}`, next);
  }
  function addConsumo(data) {
    saveConsumos([{ id: uid(), ...data }, ...consumos]);
  }
  function deleteConsumo(id) {
    saveConsumos(consumos.filter((c) => c.id !== id));
  }

  /* ---------- Notificações ---------- */
  function saveNotificacoes(next) {
    setNotificacoes(next);
    persist(`notificacoes:${condominioAtual.id}`, next);
  }
  function addNotificacao(data) {
    saveNotificacoes([{ id: uid(), ...data }, ...notificacoes]);
  }
  function deleteNotificacao(id) {
    saveNotificacoes(notificacoes.filter((n) => n.id !== id));
  }

  /* ---------- Limpeza: escalas ---------- */
  function saveLimpezaEscalas(next) {
    setLimpezaEscalas(next);
    persist(`limpezaEscalas:${condominioAtual.id}`, next);
  }
  function updateLimpezaEscala(id, data) {
    saveLimpezaEscalas(limpezaEscalas.map((e) => (e.id === id ? { ...e, ...data } : e)));
  }
  function addLimpezaEscala(nome) {
    saveLimpezaEscalas([...limpezaEscalas, { id: uid(), nome, fixo: false, dataRealizacao: null, dataVencimento: null, orcamento: "", empresaTelefone: "" }]);
  }
  function deleteLimpezaEscala(id) {
    saveLimpezaEscalas(limpezaEscalas.filter((e) => e.id !== id));
  }

  /* ---------- Limpeza: estoque ---------- */
  function saveLimpezaEstoque(next) {
    setLimpezaEstoque(next);
    persist(`limpezaEstoque:${condominioAtual.id}`, next);
  }
  function addLimpezaEstoqueItem(data) {
    saveLimpezaEstoque([{ id: uid(), ...data }, ...limpezaEstoque]);
  }
  function updateLimpezaEstoqueItem(id, data) {
    saveLimpezaEstoque(limpezaEstoque.map((it) => (it.id === id ? { ...it, ...data } : it)));
  }
  function deleteLimpezaEstoqueItem(id) {
    saveLimpezaEstoque(limpezaEstoque.filter((it) => it.id !== id));
  }

  /* ---------- Limpeza: financeiro ---------- */
  function saveLimpezaFinanceiro(next) {
    setLimpezaFinanceiro(next);
    persist(`limpezaFinanceiro:${condominioAtual.id}`, next);
  }
  function addLimpezaFinanceiro(data) {
    saveLimpezaFinanceiro([{ id: uid(), ...data }, ...limpezaFinanceiro]);
  }
  function deleteLimpezaFinanceiro(id) {
    saveLimpezaFinanceiro(limpezaFinanceiro.filter((f) => f.id !== id));
  }


  /* ---------- Derivados ---------- */
  const demandasAbertas = useMemo(() => demandas.filter((d) => !d.cancelada && d.fase !== "concluida"), [demandas]);
  const obrigacoesPeriodicasUrgentes = useMemo(
    () => [...obrigacoesPeriodicas].filter((p) => p.dataVencimento).map((p) => ({ ...p, _status: obrigacaoStatus(p) })).filter((p) => p._status.key !== "ok").sort((a, b) => daysUntil(a.dataVencimento) - daysUntil(b.dataVencimento)),
    [obrigacoesPeriodicas]
  );
  const obrigacoesTrabalhistasUrgentes = useMemo(
    () => [...obrigacoesTrabalhistas].filter((p) => p.dataVencimento).map((p) => ({ ...p, _status: obrigacaoStatus(p) })).filter((p) => p._status.key !== "ok").sort((a, b) => daysUntil(a.dataVencimento) - daysUntil(b.dataVencimento)),
    [obrigacoesTrabalhistas]

const MAX_ANEXO_BYTES = 3 * 1024 * 1024;
const TIPOS_ANEXO_ACEITOS = ["application/pdf", "image/jpeg", "image/jpg", "image/png"];

function ComunicadoFormModal({ onClose, onSave }) {
  const [tipo, setTipo] = useState("Comunicado");
  const [titulo, setTitulo] = useState("");
  const [destino, setDestino] = useState("Todos");
  const [conteudo, setConteudo] = useState("");
  const [anexo, setAnexo] = useState(null);
  const [erroAnexo, setErroAnexo] = useState("");

  function handleArquivo(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    if (!TIPOS_ANEXO_ACEITOS.includes(file.type)) {
      setErroAnexo("Só é possível anexar arquivos em PDF, JPEG ou PNG.");
      setAnexo(null);
      return;
    }
    if (file.size > MAX_ANEXO_BYTES) {
      setErroAnexo("Arquivo muito grande para anexar (máx. 3MB).");
      setAnexo(null);
      return;
    }
    setErroAnexo("");
    const reader = new FileReader();
    reader.onload = () => {
      setAnexo({ nome: file.name, tipo: file.type, tamanho: file.size, dataUrl: reader.result });
    };
    reader.onerror = () => setErroAnexo("Não foi possível ler esse arquivo. Tente novamente.");
    reader.readAsDataURL(file);
  }

  return (
    <Modal title="Novo comunicado" onClose={onClose}>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Tipo">
          <select className={inputCls} value={tipo} onChange={(e) => setTipo(e.target.value)}>
            {TIPOS_COMUNICADO.map((t) => <option key={t.key} value={t.key}>{t.key}</option>)}
          </select>
        </Field>
        <Field label="Destino">
          <input className={inputCls} value={destino} onChange={(e) => setDestino(e.target.value)} placeholder="Todos / Bloco A / etc." />
        </Field>
      </div>
      <Field label="Título">
        <input className={inputCls} value={titulo} onChange={(e) => setTitulo(e.target.value)} placeholder="Ex.: Manutenção programada do elevador" />
      </Field>
      <Field label="Conteúdo">
        <textarea className={inputCls} rows={4} value={conteudo} onChange={(e) => setConteudo(e.target.value)} placeholder="Texto do comunicado..." />
      </Field>
      <Field label="Anexo — PDF, JPEG ou PNG (opcional, fica arquivado junto com o comunicado)">
        {anexo ? (
          <div className="flex items-center gap-3 border border-[var(--border)] rounded-lg px-3 py-2.5 bg-[var(--bg)]">
            {anexo.tipo.startsWith("image/") ? (
              <img src={anexo.dataUrl} alt={anexo.nome} className="w-10 h-10 rounded object-cover border border-[var(--border)] shrink-0" />
            ) : (
              <div className="w-10 h-10 rounded bg-[var(--bg-card)] border border-[var(--border)] flex items-center justify-center shrink-0">
                <Paperclip size={16} className="text-[var(--text-secondary)]" />
              </div>
            )}
            <div className="min-w-0 flex-1">
              <p className="text-sm text-[var(--text-primary)] truncate">{anexo.nome}</p>
              <p className="text-[11px] text-[var(--text-muted)]">{(anexo.tamanho / 1024).toFixed(0)} KB</p>
            </div>
            <button onClick={() => setAnexo(null)} className="text-[var(--text-muted)] hover:text-[var(--danger)] p-1 shrink-0">
              <X size={16} />
            </button>
          </div>
        ) : (
          <label className="flex items-center justify-center gap-2 border border-dashed border-[var(--border)] rounded-lg px-3 py-3 text-sm text-[var(--text-secondary)] cursor-pointer hover:border-[var(--accent-50)] hover:text-[var(--accent)] transition-colors">
            <Paperclip size={15} />
            Escolher arquivo (PDF, JPEG ou PNG)
            <input type="file" accept="application/pdf,image/png,image/jpeg" className="hidden" onChange={handleArquivo} />
          </label>
        )}
        {erroAnexo && <p className="text-xs text-[var(--danger)] mt-1.5">{erroAnexo}</p>}
      </Field>
      <button
        disabled={!titulo.trim()}
        onClick={() => onSave({ tipo, titulo, destino, conteudo, anexo })}
        className="w-full bg-[var(--accent)] disabled:opacity-40 text-[var(--accent-contrast)] font-semibold py-2.5 rounded-lg text-sm mt-1"
      >
        Publicar comunicado
      </button>
    </Modal>
  );
}

function ConsumoTipoView({ tipo, consumos, onNovo, onDelete }) {
  const tipoInfo = TIPOS_CONSUMO.find((t) => t.key === tipo) || TIPOS_CONSUMO[0];
  const entries = consumos.filter((c) => c.tipo === tipo).sort((a, b) => (a.mesAno < b.mesAno ? 1 : -1));
  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <p className="text-xs text-[var(--text-muted)]">{entries.length} registro{entries.length === 1 ? "" : "s"}</p>
        <button onClick={onNovo} className="flex items-center gap-1.5 bg-[var(--accent)] text-[var(--accent-contrast)] text-sm font-semibold px-3 py-2 rounded-lg">
          <Plus size={16} /> Novo registro
        </button>
      </div>
      {entries.length === 0 ? (
        <EmptyState text={`Nenhum registro de ${tipoInfo.label.toLowerCase()} ainda.`} actionLabel="Adicionar o primeiro" onAction={onNovo} />
      ) : (
        <div className="grid sm:grid-cols-2 gap-3">
          {entries.map((e) => <ConsumoCard key={e.id} entry={e} consumos={consumos} onDelete={onDelete} />)}
        </div>
      )}
    </div>
  );
}

function ConsumoHistorico({ consumos, onDelete }) {
  const entries = [...consumos].sort((a, b) => (a.mesAno < b.mesAno ? 1 : a.mesAno > b.mesAno ? -1 : 0));
  return (
    <div>
      {entries.length === 0 ? (
        <EmptyState text="Nenhum consumo registrado ainda." />
      ) : (
        <div className="grid sm:grid-cols-2 gap-3">
          {entries.map((e) => <ConsumoCard key={e.id} entry={e} consumos={consumos} onDelete={onDelete} />)}
        </div>
      )}
    </div>
  );
}

function ConsumoComparativos({ consumos }) {
  const grupos = useMemo(() => {
    const map = {};
    for (const c of consumos) {
      const key = c.tipo + "|" + (c.tipo === "energia" ? (c.bloco || "Geral") : "");
      if (!map[key]) map[key] = [];
      map[key].push(c);
    }
    return Object.entries(map).map(([key, items]) => {
      const [tipo, bloco] = key.split("|");
      const sorted = [...items].sort((a, b) => (a.mesAno < b.mesAno ? 1 : -1)).slice(0, 6);
      return { tipo, bloco, items: sorted };
    });
  }, [consumos]);

  if (grupos.length === 0) {
    return <EmptyState text="Ainda não há dados suficientes para comparar. Registre alguns consumos primeiro." />;
  }

  return (
    <div className="space-y-4">
      {grupos.map((g) => {
        const tipoInfo = TIPOS_CONSUMO.find((t) => t.key === g.tipo) || TIPOS_CONSUMO[0];
        return (
          <div key={g.tipo + g.bloco} className="bg-[var(--bg-card)] border border-[var(--border)] rounded-2xl p-4 shadow-lg shadow-black/20">
            <p className="text-sm text-[var(--text-primary)] font-medium mb-3">
              {tipoInfo.emoji} {tipoInfo.label}{g.bloco ? ` — ${g.bloco}` : ""}
            </p>
            <div className="space-y-1.5">
              {g.items.map((e) => {
                const variacao = calcularVariacaoValor(consumos, e);
                return (
                  <div key={e.id} className="flex items-center justify-between text-xs py-1.5 border-b border-[var(--border-soft)] last:border-0 gap-2">
                    <span className="text-[var(--text-secondary)] shrink-0" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{formatMesAno(e.mesAno)}</span>
                    {tipoInfo.unidade && <span className="text-[var(--text-body)]">{Number(e.consumo || 0).toLocaleString("pt-BR")} {tipoInfo.unidade}</span>}
                    <span className="text-[var(--text-body)]">{formatMoeda(e.valor)}</span>
                    <span style={{ color: corVariacao(variacao), minWidth: 48, textAlign: "right" }}>{formatVariacao(variacao) || "—"}</span>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function ConsumoFormModal({ tipoInicial, onClose, onSave }) {
  const tipoValido = TIPOS_CONSUMO.some((t) => t.key === tipoInicial) ? tipoInicial : "agua";
  const [tipo, setTipo] = useState(tipoValido);
  const [bloco, setBloco] = useState("");
  const [mesAno, setMesAno] = useState("");
  const [consumo, setConsumo] = useState("");
  const [valor, setValor] = useState("");
  const tipoInfo = TIPOS_CONSUMO.find((t) => t.key === tipo) || TIPOS_CONSUMO[0];

  return (
    <Modal title="Novo registro de consumo" onClose={onClose}>
      <Field label="Tipo">
        <select className={inputCls} value={tipo} onChange={(e) => setTipo(e.target.value)}>
          {TIPOS_CONSUMO.map((t) => <option key={t.key} value={t.key}>{t.emoji} {t.label}</option>)}
        </select>
      </Field>
      {tipo === "energia" && (
        <Field label="Bloco / medidor (você recebe várias contas por mês)">
          <input className={inputCls} value={bloco} onChange={(e) => setBloco(e.target.value)} placeholder="Ex.: Bloco A" />
        </Field>
      )}
      <Field label="Mês de referência">
        <input type="month" className={inputCls} value={mesAno} onChange={(e) => setMesAno(e.target.value)} />
      </Field>
      {tipoInfo.unidade ? (
        <div className="grid grid-cols-2 gap-3">
          <Field label={`Consumo (${tipoInfo.unidade})`}>
            <input type="number" className={inputCls} value={consumo} onChange={(e) => setConsumo(e.target.value)} placeholder="0" />
          </Field>
          <Field label="Valor (R$)">
            <input type="number" className={inputCls} value={valor} onChange={(e) => setValor(e.target.value)} placeholder="0" />
          </Field>
        </div>
      ) : (
        <Field label="Valor (R$)">
          <input type="number" className={inputCls} value={valor} onChange={(e) => setValor(e.target.value)} placeholder="0" />
        </Field>
      )}
      <button
        disabled={!mesAno || !valor || (tipoInfo.unidade && !consumo)}
        onClick={() => onSave({ tipo, bloco: tipo === "energia" ? bloco : "", mesAno, consumo: tipoInfo.unidade ? Number(consumo) : null, valor: Number(valor) })}
        className="w-full bg-[var(--accent)] disabled:opacity-40 text-[var(--accent-contrast)] font-semibold py-2.5 rounded-lg text-sm mt-1"
      >
        Salvar registro
      </button>
    </Modal>
  );
}

/* ---------------------------------------------------------
   Notificações e multas
--------------------------------------------------------- */

function AlertaReincidencia({ notificacoes, nome }) {
  const alvo = (nome || "").trim().toLowerCase();
  if (!alvo) return null;
  const anteriores = notificacoes
    .filter((n) => (n.notificado || "").trim().toLowerCase() === alvo)
    .sort((a, b) => (a.data < b.data ? 1 : -1));
  if (anteriores.length === 0) return null;
  const ultima = anteriores[0];
  const infracao = INFRACOES.find((i) => i.id === ultima.infracaoId);
  return (
    <div className="flex items-start gap-2.5 bg-[var(--warning-15)] border border-[var(--warning-40)] rounded-xl px-3.5 py-3 mb-4">
      <AlertTriangle size={16} className="text-[var(--warning)] shrink-0 mt-0.5" />
      <p className="text-xs text-[var(--text-primary)] leading-relaxed">
        <span className="font-semibold">{ultima.notificado}</span> foi notificado(a) em {formatDate(ultima.data)}, por {infracao ? infracao.titulo.toLowerCase() : ultima.infracaoTitulo || "infração não identificada"}.
      </p>
    </div>
  );
}

function NotificacoesTab({ condominioNome, sindicoNome, notificacoes, onAdd, onDelete }) {
  const [bloco, setBloco] = useState("");
  const [apartamento, setApartamento] = useState("");
  const [notificado, setNotificado] = useState("");
  const [notificanteNome, setNotificanteNome] = useState(sindicoNome || "");
  const [infracaoId, setInfracaoId] = useState("");
  const [tipoDocumento, setTipoDocumento] = useState("notificacao");
  const [gerando, setGerando] = useState(false);
  const [erro, setErro] = useState("");

  const infracao = INFRACOES.find((i) => i.id === infracaoId) || null;

  async function gerar() {
    if (!bloco.trim() || !apartamento.trim() || !notificado.trim() || !infracao) {
      setErro("Preencha bloco, apartamento, notificado(a) e escolha a infração.");
      return;
    }
    setErro("");
    setGerando(true);
    try {
      const data = todayISO();
      const { dataUrl, nomeArquivo } = await gerarPdfNotificacao({
        condominioNome,
        sindicoNome: notificanteNome.trim() || sindicoNome,
        bloco: bloco.trim(),
        apartamento: apartamento.trim(),
        notificado: notificado.trim(),
        infracao,
        tipoDocumento,
        data,
      });
      onAdd({
        bloco: bloco.trim(),
        apartamento: apartamento.trim(),
        notificado: notificado.trim(),
        infracaoId: infracao.id,
        infracaoTitulo: infracao.titulo,
        tipoDocumento,
        data,
        arquivo: { nome: nomeArquivo, dataUrl },
      });
      setBloco("");
      setApartamento("");
      setNotificado("");
      setInfracaoId("");
      setTipoDocumento("notificacao");
    } catch (e) {
      setErro("Não foi possível gerar o PDF agora. Verifique sua conexão e tente novamente.");
    } finally {
      setGerando(false);
    }
  }

  return (
    <div>
      <h2 className="font-semibold mb-1" style={{ fontFamily: "'Plus Jakarta Sans', sans-serif", color: AZUL_ESCURO }}>Notificações</h2>
      <p className="text-xs text-[var(--text-muted)] mb-4">Gere notificações e multas com base no Regimento Interno, com histórico organizado por morador.</p>

      <div className="bg-[var(--bg-card)] border border-[var(--border)] rounded-2xl p-5 shadow-lg shadow-black/20 mb-6">
        <Field label="Notificante (nome completo de quem está emitindo)">
          <input className={inputCls} value={notificanteNome} onChange={(e) => setNotificanteNome(e.target.value)} placeholder="Nome do síndico(a)" />
        </Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Bloco">
            <input className={inputCls} value={bloco} onChange={(e) => setBloco(e.target.value)} placeholder="Ex.: Bloco A" />
          </Field>
          <Field label="Apartamento">
            <input className={inputCls} value={apartamento} onChange={(e) => setApartamento(e.target.value)} placeholder="Ex.: 101" />
          </Field>
        </div>
        <Field label="Notificado(a)">
          <input className={inputCls} value={notificado} onChange={(e) => setNotificado(e.target.value)} placeholder="Nome completo" />
        </Field>

        <AlertaReincidencia notificacoes={notificacoes} nome={notificado} />

        <Field label="Infração">
          <select className={inputCls} value={infracaoId} onChange={(e) => setInfracaoId(e.target.value)}>
            <option value="">Selecione a infração...</option>
            {INFRACOES.map((i) => <option key={i.id} value={i.id}>{i.titulo}</option>)}
          </select>
        </Field>

        {infracao && (
          <div className="bg-[var(--bg-card-alt)] border border-[var(--border-soft)] rounded-xl px-3.5 py-3 mb-4 space-y-1.5">
            <p className="text-xs text-[var(--text-body)]"><span className="font-semibold text-[var(--text-primary)]">Penalidade:</span> {infracao.penalidade}</p>
            <p className="text-xs text-[var(--text-body)]"><span className="font-semibold text-[var(--text-primary)]">Base legal:</span> {infracao.baseLegal}</p>
          </div>
        )}

        <p className="text-xs font-medium text-[var(--text-secondary)] mb-2">Tipo de documento</p>
        <div className="flex gap-2 mb-4">
          <button
            onClick={() => setTipoDocumento("notificacao")}
            className="flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-lg text-sm font-medium border transition-colors"
            style={{
              borderColor: tipoDocumento === "notificacao" ? "var(--accent)" : "var(--border)",
              backgroundColor: tipoDocumento === "notificacao" ? "var(--accent-15)" : "transparent",
              color: tipoDocumento === "notificacao" ? "var(--accent)" : "var(--text-secondary)",
            }}
          >
            <Bell size={15} /> Notificação
          </button>
          <button
            onClick={() => setTipoDocumento("multa")}
            className="flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-lg text-sm font-medium border transition-colors"
            style={{
              borderColor: tipoDocumento === "multa" ? "var(--danger)" : "var(--border)",
              backgroundColor: tipoDocumento === "multa" ? "var(--danger-15)" : "transparent",
              color: tipoDocumento === "multa" ? "var(--danger)" : "var(--text-secondary)",
            }}
          >
            <AlertTriangle size={15} /> Multa
          </button>
        </div>

        {erro && <p className="text-xs text-[var(--danger)] mb-3">{erro}</p>}

        <button
          disabled={gerando}
          onClick={gerar}
          className="w-full bg-[var(--accent)] disabled:opacity-50 text-[var(--accent-contrast)] font-semibold py-2.5 rounded-lg text-sm"
        >
          {gerando ? "Gerando PDF..." : "Gerar arquivo"}
        </button>
      </div>

      <h3 className="text-sm font-semibold text-[var(--text-primary)] mb-3">Histórico</h3>
      {notificacoes.length === 0 ? (
        <EmptyState text="Nenhuma notificação gerada ainda." />
      ) : (
        <div className="space-y-2">
          {[...notificacoes].sort((a, b) => (a.data < b.data ? 1 : -1)).map((n) => (
            <div key={n.id} className="bg-[var(--bg-card)] border border-[var(--border)] rounded-xl px-4 py-3 flex items-start justify-between gap-3 shadow-md shadow-black/10">
              <div className="min-w-0">
                <div className="flex items-center gap-2 mb-1 flex-wrap">
                  <Pill color={n.tipoDocumento === "multa" ? "var(--danger)" : "var(--accent)"}>
                    {n.tipoDocumento === "multa" ? "Multa" : "Notificação"}
                  </Pill>
                  <span className="text-[11px] text-[var(--text-muted)]" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{formatDate(n.data)}</span>
                  <span className="text-[11px] text-[var(--text-muted)]">Bloco {n.bloco} · Apto {n.apartamento}</span>
                </div>
                <p className="text-sm text-[var(--text-primary)] font-medium truncate">{n.notificado}</p>
                <p className="text-xs text-[var(--text-body)] mt-0.5">{n.infracaoTitulo}</p>
                {n.arquivo && (
                  <a
                    href={n.arquivo.dataUrl}
                    download={n.arquivo.nome}
                    className="inline-flex items-center gap-1.5 mt-2 text-xs text-[var(--accent)] hover:text-[var(--accent-hover)] bg-[var(--bg-card-alt)] border border-[var(--border)] rounded-lg px-2.5 py-1.5"
                  >
                    <Paperclip size={12} /> Baixar PDF novamente
                  </a>
                )}
              </div>
              <button onClick={() => onDelete(n.id)} className="text-[var(--text-muted)] hover:text-[var(--danger)] p-1 shrink-0"><Trash2 size={14} /></button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Limpeza — estoque e financeiro
--------------------------------------------------------- */

function EstoqueItemCard({ item, onEdit, onDelete }) {
  const baixo = Number(item.quantidade) <= Number(item.estoqueMinimo);
  return (
    <div className="relative bg-[var(--bg-card)] border border-[var(--border)] rounded-2xl overflow-hidden shadow-lg shadow-black/20">
      <div className="absolute left-0 top-0 bottom-0 w-1.5" style={{ backgroundColor: baixo ? "var(--danger)" : "var(--success)" }} />
      <div className="pl-5 pr-4 py-4 flex items-start justify-between gap-3">
        <div className="min-w-0">
          <p className="text-sm text-[var(--text-primary)] font-medium truncate">{item.item}</p>
          <p className="text-xs text-[var(--text-body)] mt-1">{item.quantidade} {item.unidade} em estoque</p>
          <p className="text-[11px] text-[var(--text-muted)] mt-0.5">{item.localizacao}</p>
          {baixo && <p className="text-[11px] text-[var(--danger)] font-medium mt-1">Estoque baixo — mínimo: {item.estoqueMinimo} {item.unidade}</p>}
        </div>
        <div className="flex gap-1 shrink-0">
          <button onClick={() => onEdit(item)} className="text-[var(--text-muted)] hover:text-[var(--text-primary)] p-1"><Pencil size={14} /></button>
          <button onClick={() => onDelete(item.id)} className="text-[var(--text-muted)] hover:text-[var(--danger)] p-1"><Trash2 size={14} /></button>
        </div>
      </div>
    </div>
  );
}

function EstoqueFormModal({ initial, onClose, onSave }) {
  const [item, setItem] = useState(initial?.item || "");
  const [quantidade, setQuantidade] = useState(initial?.quantidade ?? "");
  const [unidade, setUnidade] = useState(initial?.unidade || "un.");
  const [estoqueMinimo, setEstoqueMinimo] = useState(initial?.estoqueMinimo ?? "");
  const [localizacao, setLocalizacao] = useState(initial?.localizacao || "");

  return (
    <Modal title={initial ? "Editar item" : "Novo item de estoque"} onClose={onClose}>
      <Field label="Item">
        <input className={inputCls} value={item} onChange={(e) => setItem(e.target.value)} placeholder="Ex.: Detergente neutro" />
      </Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Quantidade">
          <input type="number" className={inputCls} value={quantidade} onChange={(e) => setQuantidade(e.target.value)} placeholder="0" />
        </Field>
        <Field label="Unidade">
          <input className={inputCls} value={unidade} onChange={(e) => setUnidade(e.target.value)} placeholder="un. / pct / L" />
        </Field>
      </div>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Estoque mínimo">
          <input type="number" className={inputCls} value={estoqueMinimo} onChange={(e) => setEstoqueMinimo(e.target.value)} placeholder="0" />
        </Field>
        <Field label="Localização">
          <input className={inputCls} value={localizacao} onChange={(e) => setLocalizacao(e.target.value)} placeholder="Depósito, almoxarifado..." />
        </Field>
      </div>
      <button
        disabled={!item.trim() || quantidade === ""}
        onClick={() => onSave({ item: item.trim(), quantidade: Number(quantidade), unidade, estoqueMinimo: Number(estoqueMinimo) || 0, localizacao })}
        className="w-full bg-[var(--accent)] disabled:opacity-40 text-[var(--accent-contrast)] font-semibold py-2.5 rounded-lg text-sm mt-1"
      >
        Salvar
      </button>
    </Modal>
  );
}

function LimpezaFinanceiroCard({ entry, historico, onDelete }) {
  const anteriores = historico.filter((h) => h.id !== entry.id && h.mesAno < entry.mesAno).sort((a, b) => (a.mesAno < b.mesAno ? 1 : -1));
  const anterior = anteriores[0];
  const variacao = anterior && anterior.valorGasto ? ((entry.valorGasto - anterior.valorGasto) / anterior.valorGasto) * 100 : null;
  return (
    <div className="bg-[var(--bg-card)] border border-[var(--border)] rounded-2xl px-4 py-3.5 shadow-lg shadow-black/20 flex items-start justify-between gap-3">
      <div>
        <p className="text-sm text-[var(--text-primary)] font-medium">{formatMesAno(entry.mesAno)}</p>
        <p className="text-xs text-[var(--text-body)] mt-1">Gasto com limpeza: {formatMoeda(entry.valorGasto)}</p>
        {variacao !== null && (
          <p className="text-xs mt-1" style={{ color: corVariacao(variacao) }}>
            Variação: {formatVariacao(variacao)} em relação ao mês anterior
          </p>
        )}
      </div>
      <button onClick={() => onDelete(entry.id)} className="text-[var(--text-muted)] hover:text-[var(--danger)] p-1 shrink-0"><Trash2 size={14} /></button>
    </div>
  );
}

function LimpezaFinanceiroFormModal({ onClose, onSave }) {
  const [mesAno, setMesAno] = useState("");
  const [valorGasto, setValorGasto] = useState("");
  return (
    <Modal title="Registrar gasto do mês" onClose={onClose}>
      <Field label="Mês de referência">
        <input type="month" className={inputCls} value={mesAno} onChange={(e) => setMesAno(e.target.value)} />
      </Field>
      <Field label="Valor gasto com limpeza (R$)">
        <input type="number" className={inputCls} value={valorGasto} onChange={(e) => setValorGasto(e.target.value)} placeholder="0" />
      </Field>
      <button
        disabled={!mesAno || !valorGasto}
        onClick={() => onSave({ mesAno, valorGasto: Number(valorGasto) })}
        className="w-full bg-[var(--accent)] disabled:opacity-40 text-[var(--accent-contrast)] font-semibold py-2.5 rounded-lg text-sm mt-1"
      >
        Salvar
      </button>
    </Modal>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);


</script>
</body>
</html>
